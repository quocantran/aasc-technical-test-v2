services:
  postgres:
    image: postgres:16-alpine
    container_name: tiktok_bitrix_postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: tiktok_bitrix_db
    volumes:
      - tiktok_bitrix_postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tiktok_bitrix_db']
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: tiktok_bitrix_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - tiktok_bitrix_redis_data:/data
    networks:
      - backend-net
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'redis123', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tiktok_bitrix_app
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/tiktok_bitrix_db?schema=public
      - REDIS_HOST=redis
    networks:
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: tiktok_bitrix_prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - tiktok_bitrix_prometheus_data:/prometheus
    networks:
      - backend-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: tiktok_bitrix_grafana
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - tiktok_bitrix_grafana_data:/var/lib/grafana
    networks:
      - backend-net
    depends_on:
      - prometheus

volumes:
  tiktok_bitrix_postgres_data:
  tiktok_bitrix_redis_data:
  tiktok_bitrix_prometheus_data:
  tiktok_bitrix_grafana_data:

networks:
  backend-net:
    driver: bridge
